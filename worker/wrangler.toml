# Cloudflare Worker that lets the SNARE prototype talk to Claude without
# putting the API key in the public website. See README.md for setup.
name = "snare-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Sites allowed to call this worker (comma separated).
ALLOWED_ORIGINS = "https://n8moore19.github.io"
# Claude model. claude-opus-5-5 is the default; claude-haiku-5-5 is much cheaper.
MODEL = "claude-opus-5-5"
# Models for the launch agents.
AGENT_MODEL = "claude-opus-5-5"      # Chief of Staff
MARKET_MODEL = "claude-sonnet-5-5"   # Market intelligence (web search heavy, so the cheaper model)
GROWTH_MODEL = "claude-sonnet-5-5"   # Student acquisition
CONTENT_MODEL = "claude-sonnet-5-5"  # Content creation
SALES_MODEL = "claude-opus-5-5"      # B2B sales (judgement on fit and tone matters most here)
INSIGHTS_MODEL = "claude-opus-5-5"   # Insights analyst (runs as a half price batch)
ROUTER_MODEL = "claude-sonnet-5-5"   # Data and offers router (offer ideas; deliveries need no model)
PRIVACY_MODEL = "claude-sonnet-5-5"  # Privacy guard (reviews posts, outreach, offers and deliveries)
SUPPORT_MODEL = "claude-haiku-5-5"   # Student support help chat (fast and very cheap)
REWARDS_MODEL = "claude-haiku-5-5"   # Rewards ops weekly close (the checks themselves are code)

# Storage for the agents: team tasks and each agent's latest output.
# Create it once with: npx wrangler kv namespace create AGENTS
# then paste the id it prints below.
# The student panel: anonymous used and tossed events from students who opted in.
# Create it once with: npx wrangler d1 create snare-panel
# then paste the database_id it prints below. The table is created on first use.
[[d1_databases]]
binding = "PANEL"
database_name = "snare-panel"
database_id = "a908e020-3b57-4ef9-866d-da4a7b73f580"

[[kv_namespaces]]
binding = "AGENTS"
id = "d525cf6e33bd4dbcbfe65eed914ddd68"

# Two daily triggers (fits the free plan's limit):
# 12:00 UTC runs that weekday's agent: Monday Market intelligence, Tuesday Student
# acquisition, Wednesday Content creation, Thursday B2B sales, Friday Insights analyst,
# Saturday Data and offers router, Sunday Rewards ops.
# 13:00 UTC collects a finished insights batch, delivers new reports to approved
# buyers, then the Chief of Staff's daily brief
# (8:00 in Toronto in winter, 9:00 in summer).
[triggers]
crons = ["0 12 * * *", "0 13 * * *"]

# Secrets (never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TEAM_KEY     (a passcode your team types to run agents and edit tasks)
